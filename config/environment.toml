# API publication cadence, polling policy, and freshness are separate concepts.
[collection]
timeout_seconds = 20
max_retries = 2
retry_backoff_seconds = 2
max_retry_delay_seconds = 30
request_spacing_seconds = 1.5

[matching]
station_max_distance_km = 15.0
representative_method = "start_point_v1"
# Explicit coarse regional assignment; not administrative polygons or GPS stations.
[matching.route_regions]
marina_bay = "south"
woodlands_waterfront = "north"
west_coast = "west"
east_coast = "east"
bishan_ang_mo_kio = "central"
singapore_botanic_gardens = "central"
macritchie_reservoir = "central"
pasir_ris_park = "east"
bedok_reservoir = "east"
jurong_lake_gardens = "west"
rail_corridor_bukit_timah = "central"
punggol_waterway = "north"

[sources.nea_rainfall]
url = "https://api-open.data.gov.sg/v2/real-time/api/rainfall"
interval_seconds = 300
stale_after_seconds = 900
metrics = ["rainfall"]
[sources.nea_wind_speed]
url = "https://api-open.data.gov.sg/v2/real-time/api/wind-speed"
interval_seconds = 300
stale_after_seconds = 900
metrics = ["wind_speed"]
[sources.nea_wind_direction]
url = "https://api-open.data.gov.sg/v2/real-time/api/wind-direction"
interval_seconds = 300
stale_after_seconds = 900
metrics = ["wind_direction"]
[sources.nea_air_temperature]
url = "https://api-open.data.gov.sg/v2/real-time/api/air-temperature"
interval_seconds = 300
stale_after_seconds = 900
metrics = ["air_temperature"]
[sources.nea_relative_humidity]
url = "https://api-open.data.gov.sg/v2/real-time/api/relative-humidity"
interval_seconds = 300
stale_after_seconds = 900
metrics = ["relative_humidity"]
[sources.nea_pm25]
url = "https://api-open.data.gov.sg/v2/real-time/api/pm25"
interval_seconds = 900
stale_after_seconds = 7200
metrics = ["pm25"]
[sources.nea_psi]
url = "https://api-open.data.gov.sg/v2/real-time/api/psi"
interval_seconds = 900
stale_after_seconds = 7200
metrics = ["psi", "pm10"]
[sources.nea_wbgt]
url = "https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt"
interval_seconds = 900
stale_after_seconds = 2700
metrics = ["wbgt", "heat_stress_level"]

# Sprint 1 engineering policy; see docs/ENVIRONMENTAL_RISK.md.
# Scores/weights are provisional, not validated medical or navigation thresholds.
[risk]
wind_scoring_enabled = false
heat_category_thresholds = [31, 33] # MSS/NEA category boundaries; score curve is provisional.
heat_category_scores = { Low = 20, Moderate = 60, High = 90 }
spatial_bands_km = [1, 3, 5]
max_reliable_station_distance_km = 5
allow_approximate_station_estimates = true # Beyond confidence threshold, only up to matching.station_max_distance_km.
caution_score = 40
high_score = 70
blocking_rules = [] # Disabled: enabling a rule requires a policy_source and reason.
[risk.weights]
rainfall = 0.35
heat = 0.35
air_quality = 0.25
wind = 0.05
[risk.rainfall]
points = [[0, 0], [1, 20], [5, 60], [10, 100]]
[risk.wbgt]
points = [[26, 0], [31, 50], [33, 80], [35, 100]]
[risk.pm25]
points = [[0, 0], [55, 25], [150, 60], [250, 85], [350, 100]]
[risk.psi]
points = [[0, 0], [50, 15], [100, 35], [200, 70], [300, 90], [400, 100]]
[risk.wind]
points = [[8, 0], [20, 100]] # Only used when explicitly enabled; provisional.

[ranking]
neutral_accessibility = 50
access_penalty_per_km = 2
# >30% difference is not called a close match. No shortened routes are invented.
distance_relative_tolerance = 0.30
[ranking.weights]
environment = 0.45
distance = 0.25
accessibility = 0.15
difficulty = 0.15
