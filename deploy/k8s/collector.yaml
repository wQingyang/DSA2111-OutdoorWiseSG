apiVersion: apps/v1
kind: Deployment
metadata:
  name: outdoorwise-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: outdoorwise-collector
  template:
    metadata:
      labels:
        app: outdoorwise-collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: outdoorwise-app
              topologyKey: kubernetes.io/hostname
      containers:
        - name: collector
          image: outdoorwise:submission
          imagePullPolicy: IfNotPresent
          command: [python, -m, outdoorwise.cli, watch, --tick-seconds, "30"]
          envFrom:
            - configMapRef:
                name: outdoorwise-config
          env:
            - name: DATA_GOV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: outdoorwise-secrets
                  key: DATA_GOV_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: [python, -m, outdoorwise.pipeline.collector_health]
            initialDelaySeconds: 30
            periodSeconds: 30
          livenessProbe:
            exec:
              command: [python, -m, outdoorwise.pipeline.collector_health]
            initialDelaySeconds: 300
            periodSeconds: 60
            failureThreshold: 5
          volumeMounts:
            - name: runtime
              mountPath: /app/data/runtime
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: outdoorwise-runtime
