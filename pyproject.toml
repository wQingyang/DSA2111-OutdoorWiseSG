[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "outdoorwise-demo"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "pydantic>=2.8,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["outdoorwise*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
